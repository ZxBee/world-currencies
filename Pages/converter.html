<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<!-- SEO -->
<meta
    name="description"
    content="Convert currencies using current exchange rates with the World Currencies online currency converter."
>
<meta name="robots" content="index, follow">

<!-- Canonical URL -->
<link
    rel="canonical"
    href="https://ZxBee.github.io/world-currencies/pages/converter.html"
>

<!-- Open Graph -->
<meta property="og:title" content="Currency Converter - World Currencies">
<meta
    property="og:description"
    content="Convert currencies using current exchange rates with the World Currencies online currency converter."
>
<meta
    property="og:url"
    content="https://ZxBee.github.io/world-currencies/pages/converter.html"
>
<meta property="og:type" content="website">

<!-- Browser Theme -->
<meta name="theme-color" content="#ffffff">

<title>Currency Converter - World Currencies</title>

<!-- Stylesheet -->
<link rel="stylesheet" href="../style.css">


</head>

<body>

<header>
    <h1>World Currencies</h1>


<nav>
    <a href="../index.html">Home</a>
    <a href="../index.html#currencies">Currencies</a>
    <a href="converter.html">Converter</a>
    <a href="../index.html#about">About</a>
</nav>

<button
    id="themeToggle"
    class="theme-toggle"
    type="button"
    aria-label="Toggle dark mode"
>
    🌙
</button>


</header>

<main>


<section class="converter-section">

    <div class="converter-heading">
        <span class="section-label">LIVE CONVERSION</span>

        <h2>Currency Converter</h2>

        <p class="converter-subtitle">
            Convert between currencies using current exchange-rate data.
        </p>
    </div>


    <div class="converter-card">

        <div class="amount-group">

            <label for="amount">
                Amount
            </label>

            <input
                type="number"
                id="amount"
                value="1"
                min="0"
                step="any"
                placeholder="Enter amount"
            >

        </div>


        <div class="currency-selects">

            <div class="select-group">

                <label for="fromCurrency">
                    From
                </label>

                <select id="fromCurrency"></select>

            </div>


            <button
                id="swapButton"
                class="swap-button"
                type="button"
                title="Swap currencies"
                aria-label="Swap currencies"
            >
                ⇄
            </button>


            <div class="select-group">

                <label for="toCurrency">
                    To
                </label>

                <select id="toCurrency"></select>

            </div>

        </div>


        <button
            id="convertButton"
            class="convert-button"
            type="button"
        >
            Convert Currency
        </button>


        <div class="conversion-result">

            <p>
                Conversion Result
            </p>

            <h3 id="conversionResult">
                1 USD = —
            </h3>

            <div
                class="exchange-rate"
                id="exchangeRate"
            >
                Exchange Rate: —
            </div>

            <div
                class="last-updated"
                id="lastUpdated"
            >
                Last updated: —
            </div>

        </div>


        <div
            class="converter-status"
            id="converterStatus"
        >
            Ready for conversion
        </div>

    </div>

</section>


</main>

<footer>


<p>
    © 2026 World Currencies
    <span class="footer-divider">•</span>
    By MALIDU PzN
</p>


</footer>

<script src="../script.js"></script>

</body>
</html>
